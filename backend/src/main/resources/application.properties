spring.application.name=backend

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aimentor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================
server.port=8080
server.error.include-message=always

# Resume uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===============================
# Security (JWT)
# ===============================
# Set JWT_SECRET to a long random string in production. If blank, a random one is
# generated at startup (everyone is logged out whenever the server restarts).
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=${JWT_TTL_HOURS:72}
# Optional: create/promote an admin account on startup
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===============================
# AI chat providers order
# ===============================
ai.chat.order=${AI_CHAT_ORDER:gemini,groq,openrouter,mistral,unorouter,huggingface}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:40}

# UnoRouter (OpenAI-compatible gateway). Pick a model marked free in your dashboard.
ai.unorouter.api-key=${UNOROUTER_API_KEY:}
ai.unorouter.url=https://api.unorouter.com/v1/chat/completions
ai.unorouter.model=${UNOROUTER_MODEL:minimax-n2.7:free}

# Groq
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Google Gemini (OpenAI-compatible endpoint). Key: https://aistudio.google.com/apikey
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ===============================
# Mistral AI
# ===============================
mistral.api.key=${MISTRAL_API_KEY:}
mistral.model=${MISTRAL_MODEL:mistral-small-latest}

# ===============================
# OpenRouter
# ===============================
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:openrouter/free}

# Hugging Face Inference Providers (OpenAI-compatible router). Token: https://huggingface.co/settings/tokens
ai.huggingface.api-key=${HF_TOKEN:}
ai.huggingface.url=https://router.huggingface.co/v1/chat/completions
ai.huggingface.model=${HF_MODEL:openai/gpt-oss-20b}

# Voxell Forge embeddings (OpenAI-compatible /v1/embeddings). Key: https://dash.voxell.ai
ai.voxell.api-key=${FORGE_API_KEY:}
ai.voxell.url=https://api.voxell.ai/v1/embeddings
ai.voxell.model=${FORGE_MODEL:turbo}

# ===============================
# Jobs / market data (free public APIs)
# ===============================
jobs.cache-minutes=20

# Himalayas API
jobs.himalayas.enabled=true
jobs.himalayas.url=https://himalayas.app/jobs/api/search

# Jobicy API
jobs.jobicy.enabled=true
jobs.jobicy.url=https://jobicy.com/api/v2/remote-jobs

# ===============================
# Email (Resend) - optional
# ===============================
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Pathwise <onboarding@resend.dev>}